name: AxPlayerWarps
version: '${project.version}'
main: com.artillexstudios.axplayerwarps.AxPlayerWarps
api-version: '1.21.8'
folia-supported: true

# downloaded by the server on startup
libraries:
  - com.zaxxer:HikariCP:7.1.0
  - com.mysql:mysql-connector-j:9.7.0
  - org.postgresql:postgresql:42.7.5
  - com.h2database:h2:2.1.214

permissions:
  axplayerwarps.open:
    default: true
  axplayerwarps.use:
    default: true
  axplayerwarps.delete:
    default: true
  axplayerwarps.edit:
    default: true
  axplayerwarps.info:
    default: true
  axplayerwarps.open.other:
    default: op
  axplayerwarps.create:
    default: true
  axplayerwarps.warps.1:
    default: true
  axplayerwarps.delay-bypass:
    default: op
  axplayerwarps.admin.help:
    default: op
  axplayerwarps.admin.reload:
    default: op
  axplayerwarps.admin.delete:
    default: op
  axplayerwarps.admin.setowner:
    default: op
  axplayerwarps.admin.converter:
    default: op
  axplayerwarps.admin.bypass:
    default: op

softdepend:
  - PlaceholderAPI
  - Vault
  - PlayerPoints
  - TokenManager
  - WorldGuard
  - GriefPrevention
  - Lands
  - Towny
  - PlotSquared
  - HuskClaims
  - HuskTowns
  - SuperiorSkyblock2
  - BentoBox
  - Islands
